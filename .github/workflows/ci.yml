name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run lint checks
        run: ruff check .
      - name: Run format check
        run: ruff format --check .
      - name: Verify retained evidence offline
        run: python scripts/verify_retained_evidence.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel into an isolated environment
        run: |
          python -m venv /tmp/llm-eval-wheel-smoke
          /tmp/llm-eval-wheel-smoke/bin/python -m pip install dist/*.whl
      - name: Smoke-test installed package outside checkout
        working-directory: /tmp
        run: |
          /tmp/llm-eval-wheel-smoke/bin/python -c "import llm_eval_guardrails; print(llm_eval_guardrails.__version__)"
          /tmp/llm-eval-wheel-smoke/bin/llm-eval-guardrails --help
